<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ApexSignal</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0B0E14" />
<link rel="icon" href="favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ApexSignal" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>

<style>
  :root {
    --bg: #0B0E14;
    --surface: #141925;
    --surface-raised: #1B212F;
    --border: #262E3F;
    --text-primary: #E7EBF2;
    --text-muted: #8A93A8;
    --accent-safe: #19E0C4;
    --accent-safe-dim: rgba(25,224,196,0.12);
    --accent-aggr: #FF9450;
    --accent-aggr-dim: rgba(255,148,80,0.12);
    --accent-danger: #FF4D6D;
    --accent-danger-dim: rgba(255,77,109,0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); height: 100%; }
  body { color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace; }
  .display { font-weight: 700; letter-spacing: -0.01em; }

  .app-shell { max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; background: var(--bg);
    position: relative; display: flex; flex-direction: column; overflow: hidden; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 19px; }
  .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-safe); }
  .live-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
  .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-safe); }

  .content { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 16px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
  .card-raised { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 14px; padding: 15px; }

  .panel-section { margin-bottom: 16px; }
  .panel-section:last-of-type { margin-bottom: 0; }
  .panel-label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 8px; }
  .panel-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .panel-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; margin-bottom: 16px; }

  input[type="range"] { width: 100%; accent-color: var(--accent-safe); height: 28px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--border); background: transparent; color: var(--text-muted);
    padding: 9px 14px; border-radius: 999px; font-size: 13.5px; cursor: pointer; }
  .chip.active-safe { border-color: var(--accent-safe); background: var(--accent-safe-dim); color: var(--accent-safe); }
  .chip.active-aggr { border-color: var(--accent-aggr); background: var(--accent-aggr-dim); color: var(--accent-aggr); }

  .btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; border-radius: 12px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; }
  .btn-primary { background: var(--accent-safe); color: #0B0E14; margin-top: 4px; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-ghost { background: var(--surface); color: var(--text-primary); border: 1px solid var(--border); margin-top: 4px; }
  .btn-ghost:hover { background: var(--surface-raised); }
  .btn-small { min-height: 36px; font-size: 13px; }
  .btn-saved { background: var(--surface-raised); color: var(--accent-safe); margin-top: 4px; }

  .ticket-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 4px 9px; border-radius: 7px; }
  .badge-safe { background: var(--accent-safe-dim); color: var(--accent-safe); }
  .badge-aggr { background: var(--accent-aggr-dim); color: var(--accent-aggr); }
  .total-odds { font-size: 24px; font-weight: 700; text-align: right; }
  .total-odds-label { font-size: 11px; color: var(--text-muted); text-align: right; }

  .selection-row { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .selection-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .selection-top { display: flex; align-items: center; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .selection-bottom { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }

  .prob-bar { position: relative; width: 100%; height: 6px; border-radius: 999px; background: var(--border); }
  .prob-fill { position: absolute; top: 0; left: 0; height: 6px; border-radius: 999px; background: var(--accent-safe); }
  .prob-tick { position: absolute; top: -3px; left: 70%; width: 1px; height: 12px; background: var(--text-muted); }

  .combined-prob { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; }
  .combined-prob-value { font-weight: 700; }

  .ticket-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  @media (max-width: 480px) { .ticket-actions { gap: 6px; } }
  .btn-ghost { flex: 1; background: var(--surface-raised); color: var(--text-primary); min-height: 46px; border-radius: 12px; }
  .btn-ghost:disabled { opacity: 0.5; cursor: default; }
  .btn-save { flex: 1; border: none; cursor: pointer; min-height: 46px; border-radius: 12px; }
  .btn-save:disabled { opacity: 0.4; cursor: default; }

  .empty-state { text-align: center; padding: 28px 0; font-size: 13px; color: var(--text-muted); }

  .live-feed { display: flex; flex-direction: column; gap: 12px; }
  .live-row-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .live-row-match { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .live-row-minute { font-size: 12px; color: var(--text-muted); }
  .live-row-market { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .live-market-badge { font-size: 13px; padding: 2px 8px; border-radius: 6px; }
  .live-row-text { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin: 0; }
  .live-row-stake { font-size: 12px; margin-top: 8px; font-weight: 600; }
  .fade-in { opacity: 1; }

  /* ── INTERAKTIVNÍ TOUR ── */
  .tour-spotlight { position: fixed; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.78); border: 2px solid #19E0C4; pointer-events: none; z-index: 1000; }
  .tour-card { position: fixed; z-index: 1001; background: #141925; border: 1px solid #262E3F; border-radius: 18px; padding: 20px; max-width: 320px; width: calc(100vw - 40px); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .tour-dot { width: 6px; height: 6px; border-radius: 50%; background: #262E3F; display: inline-block; }
  .tour-dot.active { background: #19E0C4; width: 14px; border-radius: 3px; }
  .tour-next { width: 100%; padding: 12px; background: #19E0C4; color: #0B0E14; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 14px; }
  .tour-skip { background: none; border: none; color: #8A93A8; font-size: 12px; cursor: pointer; margin-top: 8px; width: 100%; text-align: center; display: block; padding: 4px; }

  .bottom-nav { flex-shrink: 0;
    display: flex; gap: 6px; background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: none; color: var(--text-muted); font-size: 10.5px; font-weight: 600;
    padding: 6px 0; border-radius: 14px; position: relative; cursor: pointer; transition: color .15s, background .15s; }
  .nav-btn.active { color: var(--accent-safe); background: var(--accent-safe-dim); }
  .nav-badge { position: absolute; top: 0; right: calc(50% - 24px); background: var(--accent-danger); color: #fff;
    font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 999px; min-width: 16px; text-align: center; }

  svg.icon { width: 14px; height: 14px; flex-shrink: 0; }
  svg.icon-nav { width: 18px; height: 18px; flex-shrink: 0; }

  .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 360px; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; }
  .auth-toggle { display: flex; background: var(--surface); border-radius: 10px; padding: 3px; margin-bottom: 20px; }
  .auth-toggle button { flex: 1; padding: 9px 0; border: none; background: transparent; color: var(--text-muted); font-size: 13px; border-radius: 8px; cursor: pointer; }
  .auth-toggle button.active { background: var(--surface-raised); color: var(--text-primary); }
  .auth-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; color: var(--text-primary); font-size: 14px; margin-bottom: 10px;
  }
  .auth-input:focus { outline: none; border-color: var(--accent-safe); }
  .auth-error { color: var(--accent-danger); font-size: 12.5px; margin: 4px 0 8px; }
  .auth-fine { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 16px; line-height: 1.5; }
  .logout-btn { background: none; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; padding: 4px 8px; }
</style>
