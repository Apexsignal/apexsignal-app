// string, appka automaticky běží na mock datech (viz fetchTickets níže).
// ---------------------------------------------------------------------
const API_BASE_URL = "";

function adaptBackendTicket(resp) {
  if (!resp) return null;
  return {
    type: resp.ticket_type,
    totalOdds: resp.total_odds,
    combinedProb: resp.combined_probability,
    recommendedStakePct: resp.recommended_stake_pct,
    summary: resp.summary,
    selections: resp.selections.map((s) => ({
      home: s.home_team, away: s.away_team, market: s.market_type + " " + s.selection,
      odds: s.odds, prob: s.probability,
      // appka si tady drží i syrová pole — potřebuje je beze ztráty pro
      // /tickets/save (jinak by se zdůvodnění a model/market čísla při
      // uložení ztratila) a pro zobrazení zdůvodnění v UI.
      raw: s,
    })),
  };
}

// --- Přihlašování -----------------------------------------------------
// Appka tohle ukládá do localStorage, NE do paměti komponenty — appka
// je teď nasazená na vlastní doméně (ne v náhledovém sandboxu Claude.ai,
// kde by localStorage nešel), takže potřebuje přežít zavření appky a
// znovuotevření, jinak by se uživatel musel přihlašovat při každém
// otevření appky na telefonu.
const AUTH_STORAGE_KEY = "apexsignal_auth";

function getStoredAuth() {
  try {
    const raw = localStorage.getItem(AUTH_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function setStoredAuth(auth) {
  try {
    if (auth) localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(auth));
    else localStorage.removeItem(AUTH_STORAGE_KEY);
  } catch (e) { /* appka i bez localStorage (privátní okno apod.) nesmí spadnout */ }
}

// Jako fetch, ale appka automaticky přiloží Authorization header a při
// 401 (token vypršel/neplatný) se appka tiše odhlásí — uživatel hned
// vidí přihlašovací obrazovku znovu, ne že appka jen ticho nic nevrátí.
async function authFetch(url, options = {}) {
  const stored = getStoredAuth();
  const headers = { ...(options.headers || {}), Authorization: `Bearer ${stored ? stored.token : ""}` };
  const resp = await fetch(url, { ...options, headers });
  if (resp.status === 401) {
    setStoredAuth(null);
    window.dispatchEvent(new Event("apexsignal:unauthorized"));
  }
  return resp;
}

async function fetchTicketsFromBackend(riskLevel, sports, markets, timeFrame, path = "/tickets/generate") {
  const resp = await authFetch(`${API_BASE_URL}${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      risk_level: riskLevel, sports, market_types: markets, time_frame_days: timeFrame,
    }),
  });
  if (!resp.ok) throw new Error("Backend vrátil chybu: " + resp.status);
  const data = await resp.json();
  return { safe: adaptBackendTicket(data.safe), aggressive: adaptBackendTicket(data.aggressive) };
}

// http(s):// -> ws(s):// — backend nabízí stejnou doménu, jen jiný protokol.
function toWsUrl(httpUrl) {
  if (httpUrl.startsWith("https://")) return "wss://" + httpUrl.slice(8);
  if (httpUrl.startsWith("http://")) return "ws://" + httpUrl.slice(7);
  return null;
}

// Převede zprávu z /ws/live-signals (tvar LiveSignalResponse) na tvar,
// který už LiveSignalRow umí zobrazit (stejný tvar jako LIVE_DEMO_EVENTS).
function adaptLiveSignalMessage(msg) {
  const isCashout = msg.signal_type === "cashout";
  const category = isCashout ? "card" : "goal";
  const market = isCashout ? msg.market : `${msg.market} — ${msg.team_side === "home" ? "domácí" : "hosté"}`;
  return {
    match: `${msg.home_team} vs ${msg.away_team}`,
    sport: "football",
    category,
    minute: msg.minute,
    market,
    odds: msg.odds,
    stake: msg.recommended_stake_pct,
    type: msg.signal_type,
    reasoning: msg.reasoning,
  };
}

    odds: 1.55, stake: 2.0, type: "entry",

function buildMockTicket(type, sports, markets, excludeMatches = []) {
  const range = type === "safe" ? [2.0, 5.0] : [5.0, 10.0];
  const pool = DEMO_MATCH_POOL.filter(m =>
    sports.includes(m.sport) && markets.includes(m.marketType) && !excludeMatches.includes(m.home + "-" + m.away)
  ).sort(() => Math.random() - 0.5);
  const selections = [];
  let runningOdds = 1;
  for (const m of pool) {
    const projected = runningOdds * m.odds;
    if (projected > range[1] && selections.length > 0) continue;
    selections.push(m);
    runningOdds = projected;
    if (runningOdds >= range[0] && runningOdds <= range[1]) break;
  }
  if (runningOdds < range[0] || runningOdds > range[1]) return null;
  const combinedProb = selections.reduce((acc, s) => acc * s.prob, 1);
  return { type, selections, totalOdds: runningOdds, combinedProb };
}

// Jednoduchý SVG graf kumulativního zisku/ztráty — appka kvůli tomuto
// jednomu grafu nepřidává žádnou novou knihovnu, vystačí si s polyline.
function MiniLineChart({ history }) {
  if (!history || history.length < 2) return null;
  const width = 300, height = 80, pad = 6;
  const values = history.map(h => h.cumulative_profit_loss);
  const min = Math.min(0, ...values), max = Math.max(0, ...values);
  const range = (max - min) || 1;
  const toX = (i) => pad + (i / (values.length - 1)) * (width - pad * 2);
  const toY = (v) => height - pad - ((v - min) / range) * (height - pad * 2);
  const points = values.map((v, i) => `${toX(i)},${toY(v)}`).join(" ");
  const last = values[values.length - 1];
  const color = last >= 0 ? "var(--accent-safe)" : "var(--accent-danger)";
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: 80, marginTop: 8 }}>
      <line x1={pad} y1={toY(0)} x2={width - pad} y2={toY(0)} stroke="var(--border)" strokeDasharray="4 4" strokeWidth="1" />
      <polyline points={points} fill="none" stroke={color} strokeWidth="2" />
    </svg>
  );
}

function AuthScreen({ onAuthenticated }) {
  const [mode, setMode] = React.useState("login");

  const [password, setPassword] = React.useState("");
  const [error, setError] = React.useState("");
  const [loading, setLoading] = React.useState(false);

  const submit = () => {
    if (!email || !password || loading) return;
    setLoading(true);
    setError("");
    const path = mode === "login" ? "/auth/login" : "/auth/register";
    fetch(`${API_BASE_URL}${path}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    })
      .then(async (r) => {
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "Něco se nepovedlo, zkus to znovu.");
        return data;
      })
      .then((data) => onAuthenticated(data))
      .catch((err) => setError(err.message))
      .finally(() => setLoading(false));
  };

  return (
    <div className="auth-screen">
      <div className="auth-card">
        <div className="brand display" style={{ justifyContent: "center", marginBottom: 22 }}>
          <span className="brand-dot"></span>ApexSignal

          <button className={mode === "register" ? "active" : ""} onClick={() => { setMode("register"); setError(""); }}>Vytvořit účet</button>
        </div>

        <input type="password" placeholder="Heslo (aspoň 8 znaků)" value={password} autoComplete={mode === "login" ? "current-password" : "new-password"}

          const safe = buildMockTicket("safe", selectedSports, selectedMarkets);
          const aggressive = buildMockTicket("aggressive", selectedSports, selectedMarkets);
          setTickets({ safe, aggressive });
          usedMatchesRef.current = [...(safe?.selections || []), ...(aggressive?.selections || [])].map(s => s.home + "-" + s.away);
          setSavedTypes({});
        })
        .finally(() => setLoadingType(null));
    } else {
      setTimeout(() => {
        const safe = buildMockTicket("safe", selectedSports, selectedMarkets);
        const aggressive = buildMockTicket("aggressive", selectedSports, selectedMarkets);
        setTickets({ safe, aggressive });
        usedMatchesRef.current = [...(safe?.selections || []), ...(aggressive?.selections || [])].map(s => s.home + "-" + s.away);
        setSavedTypes({});
        setLoadingType(null);
      }, 450);
    }
  }, [riskLevel, selectedSports, selectedMarkets, timeFrame]);

  const regenerate = (type) => {
    setLoadingType(type);
    if (API_BASE_URL) {
      fetchTicketsFromBackend(riskLevel, selectedSports, selectedMarkets, timeFrame, "/tickets/regenerate")
        .then((result) => {
          const newTicket = result[type];
          setTickets(prev => ({ ...prev, [type]: newTicket }));
          if (newTicket) usedMatchesRef.current = [...usedMatchesRef.current, ...newTicket.selections.map(s => s.home + "-" + s.away)];
          setSavedTypes(prev => ({ ...prev, [type]: false }));
        })
        .catch((err) => {
          console.warn("Backend nedostupný, používám mock data:", err);
          const newTicket = buildMockTicket(type, selectedSports, selectedMarkets, usedMatchesRef.current);
          setTickets(prev => ({ ...prev, [type]: newTicket }));
          if (newTicket) usedMatchesRef.current = [...usedMatchesRef.current, ...newTicket.selections.map(s => s.home + "-" + s.away)];
          setSavedTypes(prev => ({ ...prev, [type]: false }));
        })
        .finally(() => setLoadingType(null));
    } else {
      setTimeout(() => {
        const newTicket = buildMockTicket(type, selectedSports, selectedMarkets, usedMatchesRef.current);
        setTickets(prev => ({ ...prev, [type]: newTicket }));
        if (newTicket) usedMatchesRef.current = [...usedMatchesRef.current, ...newTicket.selections.map(s => s.home + "-" + s.away)];
        setSavedTypes(prev => ({ ...prev, [type]: false }));
        setLoadingType(null);
      }, 400);
    }
  };

  const saveTicket = (type) => {
    const ticket = tickets[type];
    const hasRealData = API_BASE_URL && ticket && ticket.selections.every(s => s.raw && s.raw.match_id != null);
    if (!hasRealData) {
      // Mock mód nebo appka bez napojeného backendu — appka se uložit
      // nemá kam, jen vizuálně potvrdí kliknutí (chování jako dřív).
      setSavedTypes(prev => ({ ...prev, [type]: true }));
      return;
    }
    authFetch(`${API_BASE_URL}/tickets/save`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        ticket_type: ticket.type, selections: ticket.selections.map(s => s.raw),
        total_odds: ticket.totalOdds, combined_probability: ticket.combinedProb,
        recommended_stake_pct: ticket.recommendedStakePct || 0,
      }),
    })
      .then(r => r.json())
      .then(() => setSavedTypes(prev => ({ ...prev, [type]: true })))
      .catch((err) => {
        console.warn("Uložení tiketu selhalo:", err);
        setSavedTypes(prev => ({ ...prev, [type]: true }));  // appka uživatele tím nezdrží — alespoň vizuální potvrzení
      });
  };

  useEffect(() => {
    if (!API_BASE_URL) {
      // Mock mód — appka demonstruje UI bez backendu (chování jako dřív).
      const interval = setInterval(() => {
        const event = LIVE_DEMO_EVENTS[liveIndexRef.current % LIVE_DEMO_EVENTS.length];
        liveIndexRef.current += 1;
        const matchesFilter = appliedSportsRef.current.includes(event.sport) && appliedCategoriesRef.current.includes(event.category);
        if (!matchesFilter) return;
        setLiveEvents(prev => [{ ...event, key: Date.now() }, ...prev].slice(0, 8));
        if (activeTabRef.current !== "live") setUnreadLive(c => c + 1);
      }, 4000);
      return () => clearInterval(interval);
    }

    // Reálný backend — globální WebSocket feed (viz /ws/live-signals v backend_api.py).
    // Appka neví dopředu, jaké zápasy jsou live, takže se připojuje na "všechno"
    // a filtr na sport/kategorii řeší až tady na klientovi.
    let socket, reconnectTimer, pingInterval, stopped = false;

    function connect() {
      const wsUrl = toWsUrl(API_BASE_URL) + "/ws/live-signals";
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        pingInterval = setInterval(() => {
          if (socket.readyState === WebSocket.OPEN) socket.send("ping");
        }, 25000);
      };

      socket.onmessage = (e) => {
        try {
          const event = adaptLiveSignalMessage(JSON.parse(e.data));
          const matchesFilter = appliedSportsRef.current.includes(event.sport) && appliedCategoriesRef.current.includes(event.category);
          if (!matchesFilter) return;
          setLiveEvents(prev => [{ ...event, key: Date.now() }, ...prev].slice(0, 8));
          if (activeTabRef.current !== "live") setUnreadLive(c => c + 1);
        } catch (err) { /* neočekávaný tvar zprávy — ignorovat, appku to nesmí shodit */ }
      };

      socket.onclose = () => {
        clearInterval(pingInterval);
        // Render free-tier se občas uspí / spojení vypadne — zkusíme znovu za 5s,
        // dokud appka neodejde z téhle obrazovky (cleanup nastaví stopped = true).
        if (!stopped) reconnectTimer = setTimeout(connect, 5000);
      };

      socket.onerror = () => socket.close();
    }

    connect();
    return () => {
      stopped = true;
      clearTimeout(reconnectTimer);
      clearInterval(pingInterval);
      if (socket) socket.close();
    };
  }, []);

  useEffect(() => { generate(); }, [generate]);

  const openLiveTab = () => { setActiveTab("live"); setUnreadLive(0); };

  if (!authUser) {
    return (
      <AuthScreen
        onAuthenticated={(data) => {
          setStoredAuth({ token: data.token, email: data.email });
          setAuthUser({ token: data.token, email: data.email });
        }}
      />
    );
  }

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brand display"><span className="brand-dot"></span>ApexSignal</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div className="live-status"><span className="pulse-dot"></span>Live</div>
          {API_BASE_URL && (
            <button className="logout-btn" onClick={logout} title={authUser.email}>Odhlásit</button>
          )}
        </div>
      </div>

      <div className="content">
        {activeTab === "tickets" && (
          <TicketsView
            riskLevel={riskLevel} setRiskLevel={setRiskLevel}
            selectedSports={selectedSports} toggleSport={toggleSport}
            selectedMarkets={selectedMarkets} toggleMarket={toggleMarket}
            timeFrame={timeFrame} setTimeFrame={setTimeFrame}
            generate={generate} loadingType={loadingType} tickets={tickets}
            regenerate={regenerate} saveTicket={saveTicket} savedTypes={savedTypes}
          />
        )}
        {activeTab === "live" && (
          <LiveView
            liveEvents={liveEvents}
            draftSports={draftSports} toggleDraftSport={toggleDraftSport}
            draftCategories={draftCategories} toggleDraftCategory={toggleDraftCategory}
            saveFilters={saveFilters} filtersSaved={filtersSaved}
          />
        )}
        {activeTab === "history" && <HistoryView />}
      </div>

      <div className="bottom-nav">
        <button className={"nav-btn" + (activeTab === "tickets" ? " active" : "")} onClick={() => setActiveTab("tickets")}>
          <IconTicket nav /> <span>Tikety</span>
        </button>
        <button className={"nav-btn" + (activeTab === "live" ? " active" : "")} onClick={openLiveTab}>
          {unreadLive > 0 && <span className="nav-badge">{unreadLive}</span>}
          <IconRadio nav /> <span>Live</span>
        </button>
        <button className={"nav-btn" + (activeTab === "history" ? " active" : "")} onClick={() => setActiveTab("history")}>
          <IconHistory nav /> <span>Historie</span>
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ApexSignalApp />);
</script>
<style>@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</style>
<script>
  // Service worker appka potřebuje jen pro to, aby ji telefon (hlavně
  // Android/Chrome) nabídl k instalaci na domovskou obrazovku — appka
  // sama o sobě je pořád živá webová appka, žádné offline ambice.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        console.warn("Service worker se nezaregistroval (appka i tak funguje normálně):", err);
      });
    });
  }
</script>
</body>
</html>
